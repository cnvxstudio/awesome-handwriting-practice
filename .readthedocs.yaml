{
  "version": 2,
  "build": {
    "os": "ubuntu-24.04",
    "tools": {
      "python": "3.12"
    },
    "commands": [
      "python -m pip install mkdocs==1.6.1",
      "mkdir -p docs",
      "cp README.md docs/index.md",
      "cp browser-pdf-worksheet-architecture.md docs/architecture.md",
      "mkdocs build --site-dir $READTHEDOCS_OUTPUT/html"
    ]
  }
}
